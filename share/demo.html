<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Web Share API — Тест в Opera</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 40px 20px;
      line-height: 1.6;
    }
    .info { color: #000; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
    .warn { color: #cc7a00; }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin: 20px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .download-link {
      display: block;
      margin: 20px auto;
      padding: 12px 20px;
      background-color: #2196f3;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>📤 Тест Web Share API</h1>
  <p>Проверка поддержки передачи PDF-файла в Opera</p>

  <!-- Результаты проверки -->
  <p><strong>navigator.share:</strong> <span id="shareSupport">...</span></p>
  <p><strong>navigator.canShare:</strong> <span id="canShareSupport">...</span></p>
  <p><strong>canShare({ files }):</strong> <span id="canShareFiles">...</span></p>

  <!-- Кнопка шаринга -->
  <button id="shareBtn" disabled>Поделиться PDF</button>

  <!-- Статус -->
  <p id="status" class="info">Проверка...</p>

  <!-- Fallback -->
  <div id="fallback" style="display: none;">
    <p class="warn">Браузер не поддерживает отправку файлов напрямую.</p>
    <a id="downloadLink" class="download-link" href="#" target="_blank">Скачать PDF и поделиться вручную</a>
  </div>

  <script>
    const shareSupport = document.getElementById("shareSupport");
    const canShareSupport = document.getElementById("canShareSupport");
    const canShareFiles = document.getElementById("canShareFiles");
    const status = document.getElementById("status");
    const button = document.getElementById("shareBtn");
    const fallback = document.getElementById("fallback");
    const downloadLink = document.getElementById("downloadLink");

    // Создаём простой PDF (валидный бинарный массив)
    const pdfArray = new Uint8Array([
      0x25, 0x50, 0x44, 0x46, 0x2D, 0x31, 0x2E, 0x35, 0x0A,
      0x25, 0xC4, 0xE5, 0xF2, 0xE5, 0xEA, 0xA7, 0x20, 0x0A,
      0x0A, 0x31, 0x20, 0x30, 0x20, 0x6F, 0x62, 0x6A, 0x0A,
      0x3C, 0x3C, 0x2F, 0x54, 0x79, 0x70, 0x65, 0x2F, 0x43, 0x61, 0x74, 0x61, 0x6C, 0x6F, 0x67, 0x2F, 0x50, 0x61, 0x67, 0x65, 0x73, 0x20, 0x32, 0x20, 0x30, 0x20, 0x52, 0x3E, 0x3E, 0x0A, 0x65, 0x6E, 0x64, 0x6F, 0x62, 0x6A, 0x0A, 0x0A, 0x32, 0x20, 0x30, 0x20, 0x6F, 0x62, 0x6A, 0x0A, 0x3C, 0x3C, 0x2F, 0x54, 0x79, 0x70, 0x65, 0x2F, 0x50, 0x61, 0x67, 0x65, 0x73, 0x2F, 0x4B, 0x69, 0x64, 0x73, 0x5B, 0x33, 0x20, 0x30, 0x20, 0x52, 0x5D, 0x2F, 0x43, 0x6F, 0x75, 0x6E, 0x74, 0x20, 0x31, 0x3E, 0x3E, 0x0A, 0x65, 0x6E, 0x64, 0x6F, 0x62, 0x6A, 0x0A, 0x0A, 0x33, 0x20, 0x30, 0x20, 0x6F, 0x62, 0x6A, 0x0A, 0x3C, 0x3C, 0x2F, 0x54, 0x79, 0x70, 0x65, 0x2F, 0x50, 0x61, 0x67, 0x65, 0x2F, 0x50, 0x61, 0x72, 0x65, 0x6E, 0x74, 0x20, 0x32, 0x20, 0x30, 0x20, 0x52, 0x2F, 0x4D, 0x65, 0x64, 0x69, 0x61, 0x42, 0x6F, 0x78, 0x5B, 0x30, 0x20, 0x30, 0x20, 0x35, 0x39, 0x35, 0x20, 0x38, 0x34, 0x32, 0x5D, 0x3E, 0x3E, 0x0A, 0x65, 0x6E, 0x64, 0x6F, 0x62, 0x6A, 0x0A, 0x0A, 0x78, 0x72, 0x65, 0x66, 0x0A, 0x30, 0x20, 0x34, 0x0A, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x20, 0x36, 0x35, 0x35, 0x33, 0x35, 0x20, 0x66, 0x20, 0x0A, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x31, 0x37, 0x20, 0x30, 0x30, 0x30, 0x30, 0x30, 0x20, 0x6E, 0x20, 0x0A, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x36, 0x39, 0x20, 0x30, 0x30, 0x30, 0x30, 0x30, 0x20, 0x6E, 0x20, 0x0A, 0x30, 0x30, 0x30, 0x30, 0x30, 0x30, 0x31, 0x31, 0x38, 0x20, 0x30, 0x30, 0x30, 0x30, 0x30, 0x20, 0x6E, 0x20, 0x0A, 0x74, 0x72, 0x61, 0x69, 0x6C, 0x65, 0x72, 0x0A, 0x3C, 0x3C, 0x2F, 0x53, 0x69, 0x7A, 0x65, 0x20, 0x34, 0x2F, 0x52, 0x6F, 0x6F, 0x74, 0x20, 0x31, 0x20, 0x30, 0x20, 0x52, 0x3E, 0x3E, 0x0A, 0x73, 0x74, 0x61, 0x72, 0x74, 0x78, 0x72, 0x65, 0x66, 0x0A, 0x31, 0x36, 0x36, 0x0A, 0x25, 0x25, 0x45, 0x4F, 0x46
    ]);

    const pdfBlob = new Blob([pdfArray], { type: 'application/pdf' });
    const file = new File([pdfBlob], 'test-document.pdf', { type: 'application/pdf' });

    // === ПРОВЕРКИ ===

    // 1. navigator.share
    if (navigator.share) {
      shareSupport.textContent = "✅ да";
      shareSupport.className = "success";
    } else {
      shareSupport.textContent = "❌ нет";
      shareSupport.className = "error";
      status.textContent = "Web Share API не поддерживается.";
      status.className = "error";
    }

    // 2. navigator.canShare
    if (navigator.canShare) {
      canShareSupport.textContent = "✅ да";
      canShareSupport.className = "success";
    } else {
      canShareSupport.textContent = "❌ нет";
      canShareSupport.className = "error";
    }

    // 3. canShare({ files })
    if (navigator.canShare) {
      const result = navigator.canShare({ files: [file] });
      if (result) {
        canShareFiles.textContent = "✅ да";
        canShareFiles.className = "success";
        button.disabled = false;
        status.textContent = "Готово. Нажмите, чтобы поделиться PDF.";
        status.className = "success";
      } else {
        canShareFiles.textContent = "❌ нет";
        canShareFiles.className = "error";
        status.textContent = "Передача файлов не поддерживается (требуется Android 10+).";
        status.className = "error";
      }
    } else {
      canShareFiles.textContent = "❌ navigator.canShare не поддерживается";
      canShareFiles.className = "error";
      status.textContent = "navigator.canShare не доступен.";
      status.className = "error";
    }

    // === КНОПКА ШАРИНГА ===
    button.addEventListener("click", async () => {
      status.textContent = "Выполняется...";
      status.className = "info";
      try {
        await navigator.share({
          title: "Тестовый PDF",
          text: "Вот ваш PDF-документ",
          files: [file]
        });
        status.textContent = "✅ Успешно поделено!";
        status.className = "success";
      } catch (err) {
        if (err.name === "AbortError") {
          status.textContent = "Отменено пользователем.";
        } else {
          status.textContent = `❌ Ошибка: ${err.message}`;
        }
        status.className = "error";
        showFallback();
      }
    });

    // === FALLBACK ===
    function showFallback() {
      fallback.style.display = "block";
      downloadLink.href = URL.createObjectURL(file);
      downloadLink.download = "test-document.pdf";
    }

    // Если canShare нет или вернул false — сразу показываем fallback
    if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
      showFallback();
    }
  </script>
</body>
</html>
