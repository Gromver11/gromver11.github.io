<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Share PDF</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; }
    button {
      font-size: 18px;
      padding: 12px 24px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .error { color: red; }
    .success { color: green; }
    .info { color: #555; }
  </style>
</head>
<body>
  <h1>📤 Тест: отправка PDF через Web Share API</h1>
  <p>Попробуйте поделиться PDF и выбрать <strong>Gmail</strong></p>

  <button id="shareBtn">Поделиться PDF</button>
  <p id="status" class="info">Проверка поддержки...</p>

  <script>
    // Весь JavaScript здесь — НЕ в отдельном файле
    const button = document.getElementById("shareBtn");
    const status = document.getElementById("status");

    const pdfContent = `%PDF-1.4
... (весь PDF как строка) ...
%%EOF`;

    const pdfBlob = new Blob([pdfContent], { type: 'application/pdf' });
    const file = new File([pdfBlob], 'test.pdf', { type: 'application/pdf' });

    if (!navigator.share) {
      status.textContent = 'Web Share API не поддерживается.';
      status.className = 'error';
      button.disabled = true;
    } else if (!navigator.canShare || !navigator.canShare({ files: [file] })) {
      status.textContent = 'Передача файлов не поддерживается (требуется Android 10+).';
      status.className = 'error';
      button.disabled = true;
    } else {
      status.textContent = 'Готово. Нажмите, чтобы поделиться PDF.';
      status.className = 'success';

      button.addEventListener('click', async () => {
        try {
          await navigator.share({
            title: 'Документ',
            text: 'Вот PDF-файл.',
            files: [file]
          });
          status.textContent = '✅ Успешно!';
        } catch (err) {
          status.textContent = err.name === 'AbortError' ? 'Отменено' : 'Ошибка: ' + err.message;
          console.error(err);
        }
      });
    }
  </script>
</body>
</html>
